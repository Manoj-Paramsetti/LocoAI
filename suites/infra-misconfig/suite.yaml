name: infra-misconfig
description: Can the model spot infrastructure misconfigurations without inventing them?
dataset: cases.yaml
model: claude-opus-5-5
effort: medium
max_tokens: 2000
system: |
  You review infrastructure configuration for security misconfigurations.
  Respond with raw JSON only, no code fences: {"findings": [{"category": "...", "detail": "..."}]}
  Use only these categories: public_storage, open_ingress, privileged_container, root_user, hardcoded_secret, wildcard_iam.
  If the configuration has none of these problems, respond with {"findings": []}.
graders:
  - type: regex
  - type: json_schema
    schema:
      type: object
      required: [findings]
      additionalProperties: false
      properties:
        findings:
          type: array
          items:
            type: object
            required: [category, detail]
            additionalProperties: false
            properties:
              category:
                enum: [public_storage, open_ingress, privileged_container, root_user, hardcoded_secret, wildcard_iam]
              detail:
                type: string
gate:
  threshold: 0.8
  regression_tolerance: 0.1
